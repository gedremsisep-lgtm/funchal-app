name: Build do APK (Funchal Mobile)

# Builda o .apk sempre que o index.html (a tela) ou o projeto Android mudam.
# Quando existe um keystore de release nos Secrets do repositório, o APK sai
# assinado para valer; sem ele, sai assinado com a chave de debug — instala
# e funciona igual, só não é o ideal para distribuir fora da equipe.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'funchal-mobile/**'
  workflow_dispatch:

permissions:
  contents: write

# Evita que este workflow e o "Publicar o canal" (publicar.yml) escrevam no
# versao.json ao mesmo tempo e um derrube o commit do outro.
concurrency:
  group: publicacao-funchal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: funchal-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      - name: Instalar dependências
        run: npm ci

      - name: Copiar a tela mais recente para dentro do projeto
        run: cp ../index.html www/index.html

      - name: Ler a versão de dentro do próprio index.html
        id: ver
        run: |
          TELA=$(grep -o "APP_VERSION = '[^']*'" www/index.html | head -1 | sed "s/.*'\(.*\)'/\1/")
          echo "tela=$TELA" >> "$GITHUB_OUTPUT"
          echo "Versão da tela: $TELA"

      - name: Sincronizar com o Capacitor
        run: npx cap sync android

      - name: Garantir que o gradlew pode ser executado
        # O projeto passa pelo Windows antes de chegar aqui, e o Windows não
        # guarda a permissão de execução do Linux -- sem isso, ./gradlew falha
        # com "Permission denied" antes mesmo de começar a compilar.
        run: chmod +x android/gradlew

      - name: Calcular o código de versão do APK
        id: codigo
        run: |
          # Um número sempre crescente, minuto a minuto -- nunca precisa editar à mão.
          CODIGO=$(date -u +%y%m%d%H%M | sed 's/^0*//')
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          cd android
          sed -i "s/versionCode [0-9]*/versionCode $CODIGO/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.tela }}\"/" app/build.gradle

      - name: Preparar o keystore de release (se configurado nos Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "tem=1" >> "$GITHUB_OUTPUT"
          else
            echo "tem=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem ANDROID_KEYSTORE_BASE64 nos Secrets -- o APK sai assinado com a chave de debug."
          fi

      - name: Build (assinado de release)
        if: steps.keystore.outputs.tem == '1'
        working-directory: funchal-mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../../Funchal-Mobile.apk

      - name: Build (assinado de debug -- sem keystore configurado)
        if: steps.keystore.outputs.tem == '0'
        working-directory: funchal-mobile/android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Funchal-Mobile.apk

      - name: Atualizar o versao.json com a versão do app
        working-directory: .
        run: |
          python3 - "$GITHUB_OUTPUT" << 'PY'
          import json, os
          v = json.load(open('versao.json'))
          v['apkVersionCode'] = int(${{ steps.codigo.outputs.codigo }})
          v['apkVersionName'] = "${{ steps.ver.outputs.tela }}"
          v['apkUrl'] = "https://gedremsisep-lgtm.github.io/funchal-app/Funchal-Mobile.apk"
          json.dump(v, open('versao.json','w'), indent=2, ensure_ascii=False)
          PY

      - name: Publicar o .apk e o versao.json
        run: |
          cd ..
          git config user.name  'Publicador Funchal'
          git config user.email 'actions@github.com'
          git add Funchal-Mobile.apk versao.json
          git diff --cached --quiet && echo "Nada novo para publicar." || \
            (git commit -m "APK ${{ steps.ver.outputs.tela }} (código ${{ steps.codigo.outputs.codigo }})" && git push)
